spring.application.name=chichijik

# 서버 포트 (환경변수 PORT, 기본 8080)
server.port=${PORT:8080}

# 저장 위치: DB 파일과 업로드 영상 (환경변수 DATA_DIR / UPLOAD_DIR)
app.data-dir=${DATA_DIR:./data}
app.upload-dir=${UPLOAD_DIR:${app.data-dir}/uploads}

# H2 파일 DB - 별도 DB 설치 없이 재시작 후에도 데이터 유지
spring.datasource.url=jdbc:h2:file:${app.data-dir}/chichijik;LOCK_TIMEOUT=35000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 업로드 최대 크기 (환경변수 MAX_UPLOAD_SIZE, 예: 500MB, 2GB)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:1GB}
server.tomcat.max-swallow-size=-1

# ---- 2단계: 방송(WebRTC) ----
# 방송 하나당 동시 시청자 상한 (P2P라 휴대폰 업로드 대역폭에 비례)
app.live.max-viewers=${MAX_VIEWERS_PER_BROADCAST:5}
# STUN 서버 (쉼표로 여러 개). 비우면 같은 네트워크에서만 연결됩니다.
app.live.stun-urls=${STUN_URLS:stun:stun.l.google.com:19302}
# TURN 서버 (선택). 막힌 네트워크에서 중계가 필요할 때만 설정
app.live.turn-url=${TURN_URL:}
app.live.turn-username=${TURN_USERNAME:}
app.live.turn-password=${TURN_PASSWORD:}

# ---- 5단계: 재연결 유예 ----
# 송출 연결이 끊긴 뒤 방송을 종료하기 전까지 기다리는 시간 (비정상으로 끊긴 시청자 자리도 이 시간 동안 남겨 둠)
app.live.reconnect-grace=${RECONNECT_GRACE:20s}

# ---- 3단계: 로그인 세션 ----
# 마지막 요청 이후 세션 유지 시간 (긴 방송 중에도 종료 버튼이 동작하도록 넉넉하게)
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS 로 실행할 때는 세션 쿠키를 HTTPS 에서만 전송
server.servlet.session.cookie.secure=${SSL_ENABLED:false}

# ---- HTTPS (휴대폰 카메라·마이크는 HTTPS에서만 동작) ----
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# ---- 4단계: 도네이션 결제 (테스트·샌드박스 전용) ----
# auto: TOSS 키가 있으면 토스페이먼츠 테스트 모드, 없으면 내장 가짜 PG / toss / fake
app.payment.provider=${PAYMENT_PROVIDER:auto}
# 토스페이먼츠 "API 개별 연동 키" 중 테스트 키(test_ck_ / test_sk_)만 허용. 시크릿 키는 절대 커밋하지 마세요.
app.payment.toss.client-key=${TOSS_CLIENT_KEY:}
app.payment.toss.secret-key=${TOSS_SECRET_KEY:}
app.payment.toss.api-base=https://api.tosspayments.com
app.payment.toss.read-timeout=30s

# ---- 5단계: 여러 인스턴스 (cluster 프로필에서만 켬) ----
# 기본 프로필은 Redis 를 쓰지 않음: 로그인 세션은 서버 메모리. cluster 프로필(application-cluster.properties)에서 다시 켭니다.
spring.autoconfigure.exclude=\
  org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
