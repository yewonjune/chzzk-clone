<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치치직 - 방송</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-mark">▶</span>치치<span class="accent">직</span></a>
    <div class="nav"><a class="btn btn-live" href="/go-live.html">● 방송 시작</a><span id="auth-slot"></span></div>
  </header>
  <main>
    <section id="view" hidden>
      <div class="stage">
        <video id="player" autoplay muted playsinline></video>
        <div class="overlay" id="overlay">스트리머와 연결하는 중…</div>
        <div class="hud">
          <span class="badge live" id="status-badge"><span class="dot"></span>LIVE</span>
          <span class="badge" id="viewer-count" hidden></span>
        </div>
        <button class="btn btn-primary unmute" id="btn-unmute" hidden>🔊 소리 켜기</button>
      </div>
      <h1 class="watch-title" id="title"></h1>
      <div class="info-row">
        <span class="streamer" id="streamer"></span>
        <span id="started"></span>
        <span id="elapsed"></span>
      </div>
      <div class="summary" id="summary" hidden></div>

      <!-- 소유자에게만 보이는 제어 (서버도 소유자만 허용) -->
      <div class="owner-bar" id="owner-bar" hidden>
        <span class="meta">내 방송</span>
        <button class="btn" type="button" id="btn-rename">제목 수정</button>
        <button class="btn btn-danger" type="button" id="btn-delete" hidden>기록 삭제</button>
      </div>

      <div class="donations-wrap" id="donations"></div>
      <div class="comments-wrap" id="comments"></div>
    </section>
    <p id="error" class="error"></p>
    <a class="btn" href="/">← 목록으로</a>
  </main>
  <script src="/common.js"></script>
  <script src="/comments.js"></script>
  <script src="/donations.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const id = new URLSearchParams(location.search).get('id');
    let b = null, pc = null, sig = null, viewerId = null, pending = [], timer = null, done = false, comments = null, donations = null;

    (async () => {
      try {
        if (!id) throw new Error('방송을 찾을 수 없습니다.');
        b = await chi.api(`/api/broadcasts/${encodeURIComponent(id)}`);
        setTitle(b.title);
        $('streamer').textContent = chi.name(b);
        $('started').textContent = `${chi.time(b.startedAt)} 시작`;
        $('view').hidden = false;
        comments = chiComments.mount($('comments'), { kind: 'broadcasts', id: b.id, ownerOf: () => b.owner });
        donations = chiDonations.mount($('donations'), { kind: 'broadcasts', id: b.id, ownerOf: () => b.owner });
        chi.ready.then(updateOwnerBar);
        if (b.status === 'ended') return showEnded('종료된 방송입니다.');

        const config = await chi.api('/api/live-config').catch(() => ({ iceServers: [] }));
        timer = setInterval(() => { $('elapsed').textContent = `방송 ${chi.elapsed(b.startedAt)}`; }, 1000);
        connect(config.iceServers);
      } catch (e) {
        $('error').textContent = e.message;
      }
    })();

    function setTitle(t) {
      b.title = t;
      document.title = `${t} - 치치직`;
      $('title').textContent = t;
    }

    function updateOwnerBar() {
      $('owner-bar').hidden = !chi.isMe(b.owner);
      $('btn-delete').hidden = b.status !== 'ended'; // 방송 중에는 삭제 불가 (서버도 409)
    }

    // 영상(P2P)이 아직 살아 있는지. 살아 있으면 시그널링만 다시 붙고(같은 시청자로 이어 붙기), 아니면 새로 입장합니다.
    const p2pAlive = () => !!pc && ['connected', 'connecting', 'disconnected'].includes(pc.connectionState);

    // 시그널링 연결은 끊기면 자동으로 다시 연결합니다(서버가 내려가면 4001 → 바로, 그 외 비정상 종료 → 백오프).
    // 방송 종료(ended)·가득 참(full)을 받으면 stop() 으로 재연결을 멈춥니다.
    function connect(iceServers) {
      sig = chi.signaling(`/ws/broadcasts/${b.id}`, {
        onOpen: (reconnected) => {
          if (reconnected && viewerId && p2pAlive()) {
            send({ type: 'join', role: 'viewer', viewerId }); // 같은 시청자로 이어 붙기: 영상은 끊기지 않음
          } else if (reconnected && viewerId) {
            // 영상도 끊겼으면 처음부터 다시 입장: 이전 자리는 서버가 바로 비움(시청자 수·상한에 남지 않음)
            pc?.close(); pc = null; pending = [];
            send({ type: 'join', role: 'viewer', viewerId, startOver: true });
          } else {
            if (reconnected) { pc?.close(); pc = null; pending = []; }
            send({ type: 'join', role: 'viewer' });
          }
        },
        onMessage: (m) => onMessage(m, iceServers),
        onDisconnect: () => {
          if (p2pAlive()) $('viewer-count').textContent = '재연결 중…';
          else overlay('서버와 다시 연결하는 중…');
        },
        onClosed: () => { if (!done) overlay('서버와의 연결이 끊겼습니다. 새로고침해 주세요.'); },
      });
    }

    async function onMessage(m, iceServers) {
      if (m.type === 'joined') {
        viewerId = m.viewerId;
      } else if (m.type === 'viewers') {
        $('viewer-count').hidden = false;
        $('viewer-count').textContent = chi.viewers(m.count);
      } else if (m.type === 'full') {
        overlay(`시청자가 가득 찼습니다. (최대 ${m.max}명) 잠시 후 다시 시도해 주세요.`);
        stop();
      } else if (m.type === 'ended') {
        showEnded('방송이 종료되었습니다.');
      } else if (m.type === 'comment') {
        comments?.onPush(m);
      } else if (m.type === 'donation') {
        donations?.onPush(m);
      } else if (m.type === 'title') {
        setTitle(m.title);
      } else if (m.type === 'signal') {
        await onSignal(m.data, iceServers);
      }
    }

    async function onSignal(data, iceServers) {
      if (data.sdp) {
        // 송출자가 보낸 offer → answer (송출자가 다시 연결하면 새 offer가 올 수 있음)
        pc?.close();
        pending = [];
        pc = new RTCPeerConnection({ iceServers });
        pc.ontrack = (e) => {
          const v = $('player');
          if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
          $('overlay').hidden = true;
          v.play().catch(() => {});
          $('btn-unmute').hidden = !v.muted;
        };
        pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'signal', data: { candidate: e.candidate } }); };
        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            overlay('영상 연결에 실패했습니다. 휴대폰과 같은 Wi-Fi에 연결했는지 확인해 주세요. (다른 네트워크라면 TURN 설정이 필요할 수 있습니다)');
          }
        };
        await pc.setRemoteDescription(data.sdp);
        for (const c of pending.splice(0)) await pc.addIceCandidate(c).catch(() => {});
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ type: 'signal', data: { sdp: pc.localDescription } });
      } else if (data.candidate) {
        if (pc?.remoteDescription) await pc.addIceCandidate(data.candidate).catch(() => {});
        else pending.push(data.candidate);
      }
    }

    // 브라우저 자동재생 정책: 소리 있는 영상은 사용자 동작 없이 재생할 수 없어 음소거로 시작합니다.
    $('btn-unmute').addEventListener('click', () => {
      const v = $('player');
      v.muted = false;
      v.play().catch(() => {});
      $('btn-unmute').hidden = true;
    });

    $('btn-rename').onclick = async () => {
      const title = prompt('방송 제목', b.title);
      if (title == null || !title.trim()) return;
      try {
        const updated = await chi.api(`/api/broadcasts/${b.id}`, { method: 'PATCH', json: { title } });
        setTitle(updated.title);
      } catch (err) { $('error').textContent = err.message; }
    };

    $('btn-delete').onclick = async () => {
      if (!confirm('이 방송 기록을 삭제할까요? 댓글도 함께 삭제되며 되돌릴 수 없습니다.')) return;
      try {
        await chi.api(`/api/broadcasts/${b.id}`, { method: 'DELETE' });
        location.replace('/');
      } catch (err) { $('error').textContent = err.message; }
    };

    async function showEnded(message) {
      stop();
      overlay(message);
      const badge = $('status-badge');
      badge.className = 'badge ended';
      badge.textContent = '종료';
      $('viewer-count').hidden = true;
      $('btn-unmute').hidden = true;
      $('player').srcObject = null;
      const latest = await chi.api(`/api/broadcasts/${b.id}`).catch(() => b);
      b.status = latest.status;
      updateOwnerBar();
      $('elapsed').textContent = '';
      $('summary').hidden = false;
      $('summary').innerHTML = `<div>방송 시간 <b>${chi.elapsed(latest.startedAt, latest.endedAt || new Date().toISOString())}</b></div>
        <div>시작 ${chi.time(latest.startedAt)}${latest.endedAt ? ` · 종료 ${chi.time(latest.endedAt)}` : ''}</div>
        <div>방송은 녹화되지 않아 다시 볼 수 없습니다. 댓글은 남아 있습니다.</div>`;
    }

    function overlay(text) {
      $('overlay').hidden = false;
      $('overlay').textContent = text;
    }

    function stop() {
      done = true;
      clearInterval(timer);
      pc?.close(); pc = null;
      sig?.stop();
    }

    function send(msg) { sig?.send(msg); }
  </script>
</body>
</html>
