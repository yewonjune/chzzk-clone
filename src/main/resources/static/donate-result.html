<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치지직 - 후원 결과</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-mark">▶</span><span class="logo-text">치지<span class="accent">직</span></span></a>
    <div class="nav"><a class="btn" href="/">목록</a><span id="auth-slot"></span></div>
  </header>
  <main>
    <div class="donate-box">
      <div class="result" id="result" data-state="pending">
        <div class="result-icon" id="icon">…</div>
        <h1 id="headline">결제 결과를 서버에서 확인하는 중입니다</h1>
        <p class="meta" id="detail"></p>
        <dl class="result-table" id="table" hidden></dl>
      </div>
      <p class="error" id="error"></p>
      <div class="controls" id="actions"></div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    // PG 결제창이 돌려보낸 화면.
    // 여기서 "성공"이라고 판단하지 않습니다. 쿼리의 값은 서버로 넘기고, 서버가 저장된 주문과 대조한 뒤
    // PG 승인 API로 확인한 결과(status)만 보여줍니다. 새로고침해서 같은 요청이 다시 가도 한 번만 적립됩니다.
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const orderId = q.get('order') || q.get('orderId');
    const STATUS = {
      PAID: ['✓', '후원이 완료되었습니다', 'ok'],
      FAILED: ['✕', '결제에 실패했습니다', 'bad'],
      CANCELED: ['–', '결제를 취소했습니다', 'bad'],
      EXPIRED: ['–', '결제 시간이 지나 주문이 만료되었습니다', 'bad'],
      REFUNDED: ['↺', '결제가 취소(환불)되었습니다', 'bad'],
      PENDING: ['…', '결제 결과를 아직 확인하지 못했습니다', 'pending'],
    };

    (async () => {
      await chi.ready;
      if (!chi.me) {
        show('PENDING', '로그인 세션이 없습니다. 로그인한 뒤 이 화면을 다시 열어 주세요.');
        $('actions').innerHTML = `<a class="btn btn-primary" href="${chi.loginUrl()}">로그인</a>`;
        return;
      }
      if (!orderId) return show('FAILED', '주문 정보가 없습니다.');
      let d = null;
      try {
        if (q.get('result') === 'success') {
          d = await chi.api('/api/donations/confirm', {
            method: 'POST',
            json: { paymentKey: q.get('paymentKey'), orderId: q.get('orderId') || orderId, amount: Number(q.get('amount')) },
          });
        } else {
          d = await chi.api(`/api/donations/${encodeURIComponent(orderId)}/abort`, {
            method: 'POST',
            json: { code: q.get('code'), message: q.get('message') },
          });
        }
      } catch (e) {
        $('error').textContent = e.message;
        d = await chi.api(`/api/donations/${encodeURIComponent(orderId)}`).catch(() => null);
      }
      if (!d) return show('FAILED', '주문을 확인할 수 없습니다.');
      render(d);
    })();

    function show(status, detail) {
      const [icon, headline, state] = STATUS[status] || STATUS.PENDING;
      $('icon').textContent = icon;
      $('headline').textContent = headline;
      $('result').dataset.state = state;
      $('detail').textContent = detail || '';
    }

    function render(d) {
      show(d.status, d.status === 'PAID'
        ? '서버가 결제 승인과 금액·받는 사람을 확인해 확정했습니다. 이 화면을 새로고침해도 다시 적립되지 않습니다.'
        : d.failureMessage ? `${d.failureMessage}${d.failureCode ? ` (${d.failureCode})` : ''}` : '');
      $('table').hidden = false;
      $('table').innerHTML = `
        <dt>받는 스트리머</dt><dd>${chi.esc(d.recipient?.nickname || '')}</dd>
        <dt>방송</dt><dd>${chi.esc(d.targetTitle || '')}</dd>
        <dt>금액</dt><dd>${chi.won(d.amount)}</dd>
        ${d.message ? `<dt>메시지</dt><dd>${chi.esc(d.message)}</dd>` : ''}
        <dt>주문번호</dt><dd class="mono">${chi.esc(d.orderId)}</dd>
        <dt>상태</dt><dd>${chi.esc(d.status)}</dd>`;
      const back = d.targetKind === 'broadcast' ? `/live.html?id=${d.targetId}`
        : d.targetKind === 'replay' ? `/replay.html?id=${d.targetId}` : '/';
      const again = d.targetKind ? `/donate.html?type=${d.targetKind}&id=${d.targetId}` : '/donate.html';
      $('actions').innerHTML = `
        <a class="btn btn-primary" href="${back}">방송으로 돌아가기</a>
        ${d.status !== 'PAID' ? `<a class="btn" href="${again}">다시 후원하기</a>` : ''}
        ${window.opener ? '<button class="btn" type="button" id="btn-close">창 닫기</button>' : ''}`;
      $('btn-close')?.addEventListener('click', () => window.close());
    }
  </script>
</body>
</html>
