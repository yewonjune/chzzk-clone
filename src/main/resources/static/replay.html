<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치지직 - 다시보기</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-mark">▶</span><span class="logo-text">치지<span class="accent">직</span></span></a>
    <div class="nav"><a class="btn btn-live" href="/go-live.html">● 방송<span class="hide-sm"> 시작</span></a><a class="btn btn-primary" href="/upload.html">＋ <span class="hide-sm">다시보기 </span>등록</a><span id="auth-slot"></span></div>
  </header>
  <main>
    <section id="watch" hidden>
      <div class="player-wrap"><video id="player" controls playsinline preload="metadata"></video></div>
      <h1 class="watch-title" id="title"></h1>
      <div class="info-row">
        <span class="streamer" id="streamer"></span>
        <span id="views"></span>
        <span id="date"></span>
        <span id="dur"></span>
      </div>
      <div class="desc" id="desc"></div>

      <!-- 소유자에게만 보이는 제어 (서버도 소유자만 허용) -->
      <div class="owner-bar" id="owner-bar" hidden>
        <span class="meta">내 다시보기</span>
        <button class="btn" type="button" id="btn-edit">수정</button>
        <button class="btn btn-danger" type="button" id="btn-delete">삭제</button>
      </div>
      <form class="edit-form" id="edit-form" hidden>
        <input id="edit-title" type="text" maxlength="100" required>
        <textarea id="edit-desc" maxlength="2000"></textarea>
        <div class="controls"><button class="btn btn-primary" type="submit">저장</button><button class="btn" type="button" id="btn-cancel">취소</button></div>
      </form>

      <div class="donations-wrap" id="donations"></div>
      <div class="comments-wrap" id="comments"></div>
    </section>
    <p id="error" class="error"></p>
    <a class="btn" href="/">← 목록으로</a>
  </main>
  <script src="/common.js"></script>
  <script src="/comments.js"></script>
  <script src="/donations.js"></script>
  <script>
    const { api, duration, views } = chi;
    const $ = (id) => document.getElementById(id);
    const id = new URLSearchParams(location.search).get('id');
    let b = null;

    function show() {
      document.title = `${b.title} - 치지직`;
      $('title').textContent = b.title;
      $('streamer').textContent = chi.name(b);
      $('views').textContent = views(b.views);
      $('date').textContent = new Date(b.createdAt).toLocaleString('ko-KR');
      $('dur').textContent = duration(b.durationSec);
      $('desc').textContent = b.description;
    }

    (async () => {
      try {
        if (!id) throw new Error('다시보기를 찾을 수 없습니다.');
        b = await api(`/api/replays/${encodeURIComponent(id)}`);
        show();
        const player = $('player');
        player.src = b.videoUrl;
        player.addEventListener('error', () => {
          $('error').textContent = '영상을 재생할 수 없습니다. 파일이 없거나 브라우저가 지원하지 않는 형식일 수 있습니다.';
        });
        $('watch').hidden = false;
        chiComments.mount($('comments'), { kind: 'replays', id: b.id, ownerOf: () => b.owner });
        chiDonations.mount($('donations'), { kind: 'replays', id: b.id, ownerOf: () => b.owner });
        chi.ready.then(() => { $('owner-bar').hidden = !chi.isMe(b.owner); });
        // 상세 화면 진입 시 조회수 1 증가 (실패해도 시청에는 영향 없음)
        api(`/api/replays/${b.id}/views`, { method: 'POST' })
          .then((r) => { $('views').textContent = views(r.views); }).catch(() => {});
      } catch (e) {
        $('error').textContent = e.message;
      }
    })();

    $('btn-edit').onclick = () => {
      $('edit-title').value = b.title;
      $('edit-desc').value = b.description;
      $('edit-form').hidden = false;
    };
    $('btn-cancel').onclick = () => { $('edit-form').hidden = true; };
    $('edit-form').onsubmit = async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      try {
        b = await api(`/api/replays/${b.id}`, { method: 'PATCH', json: { title: $('edit-title').value, description: $('edit-desc').value } });
        show();
        $('edit-form').hidden = true;
      } catch (err) { $('error').textContent = err.message; }
    };
    $('btn-delete').onclick = async () => {
      if (!confirm('이 다시보기를 삭제할까요? 영상 파일과 댓글도 함께 삭제되며 되돌릴 수 없습니다.')) return;
      try {
        await api(`/api/replays/${b.id}`, { method: 'DELETE' });
        location.replace('/');
      } catch (err) { $('error').textContent = err.message; }
    };
  </script>
</body>
</html>
