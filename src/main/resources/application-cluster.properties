# cluster 프로필: 서버 여러 대가 상태를 공유 (ADR-0006)
#   실행 예) SPRING_PROFILES_ACTIVE=cluster DB_URL=... DB_USERNAME=... DB_PASSWORD=... REDIS_HOST=... UPLOAD_DIR=... java -jar chichijik.jar
# 접속 정보는 모두 환경변수로 받습니다. 기본값이 없는 항목이 비어 있으면 기동하지 않습니다.

# 기록: PostgreSQL (예: jdbc:postgresql://postgres:5432/chichijik)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 로그인 세션: Spring Session Data Redis (세션 쿠키·CSRF 토큰 보관 방식은 그대로, 저장 위치만 Redis)
spring.autoconfigure.exclude=
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.session.redis.namespace=chichijik:session

# 업로드 영상: 모든 인스턴스가 함께 마운트한 공유 폴더
app.upload-dir=${UPLOAD_DIR}
