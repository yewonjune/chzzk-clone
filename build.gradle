plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chichijik'
version = '0.1.0'
description = '치치직 - 녹화 방송 등록/시청 서비스'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 5단계 cluster 프로필: 로그인 세션을 Redis 에 공유 (기본 프로필에서는 자동 구성을 끔)
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // cluster 태그 테스트 전용 (Docker 필요). 버전은 Spring Boot BOM 이 관리
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 기본 테스트: Docker 없이 도는 단일 서버 테스트만
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'cluster'
    }
}

// 서버 2대(cluster 프로필) 테스트: Testcontainers 로 PostgreSQL·Redis 를 띄우므로 Docker 필요
tasks.register('clusterTest', Test) {
    description = 'cluster 프로필로 서버 2대를 띄워 상태 공유를 확인합니다 (Docker 필요).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'cluster'
    }
    shouldRunAfter tasks.named('test')
}
