# 치지직 5단계: Docker Desktop 내장 Kubernetes 배포 (ADR-0006)
#
# 구성: PostgreSQL(StatefulSet+PVC) · Redis · 업로드 공유 PVC · 서버 Deployment(cluster 프로필)
#       · LoadBalancer Service · HPA(2~5개, CPU 50%)
#
# 적용 순서 (저장소 루트에서)
#   0) Docker Desktop > Settings > Kubernetes 켜기, kubectl config use-context docker-desktop
#   1) metrics-server 설치 (HPA 의 CPU 지표, k8s/hpa.yaml 머리말 참고)
#   2) 이미지 빌드:        docker build -t chzzk:local .
#   3) 네임스페이스:        kubectl apply -f k8s/00-namespace.yaml
#   4) 비밀 값 Secret:     cp .env.cluster.example .env.cluster   (값 채우기, .env.cluster 는 git 에서 제외됨)
#                          kubectl -n chzzk create secret generic chzzk-env --from-env-file=.env.cluster
#   5) (HTTPS 선택)        kubectl -n chzzk create secret generic chzzk-tls --from-file=keystore.p12=certs/chzzk.p12
#                          .env.cluster 에 SSL_ENABLED=true, SSL_KEYSTORE_PASSWORD=... 를 넣고 4) 의 Secret 을 다시 만든 뒤
#                          kubectl -n chzzk rollout restart deployment/chzzk
#   6) 나머지 전부:         kubectl apply -f k8s/
#   7) 확인:               kubectl -n chzzk get pods,svc,hpa
#                          http://localhost:8080 (HTTPS 면 https://<PC의 IP>:8080)
#
# Secret 을 바꿀 때: kubectl -n chzzk delete secret chzzk-env 후 4) 를 다시 실행하고 rollout restart
# 전부 지우기:      kubectl delete namespace chzzk   (PostgreSQL·업로드 PVC 의 데이터도 함께 삭제)
apiVersion: v1
kind: Namespace
metadata:
  name: chzzk
