# 로그인 세션·방송 실시간 상태·방송 메시지 중계(pub/sub): Redis 1대
# 디스크에 남기지 않음: Redis Pod 가 다시 뜨면 로그인 세션은 사라지고 다시 로그인해야 함 (기록은 PostgreSQL 에 그대로)
# Secret chichijik-env 에 REDIS_PASSWORD 가 있으면 비밀번호를 요구 (없으면 클러스터 내부에서만 열림)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chichijik
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chichijik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command: ["sh", "-c", "exec redis-server --save '' --appendonly no ${REDIS_PASSWORD:+--requirepass \"$REDIS_PASSWORD\"}"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: chichijik-env, key: REDIS_PASSWORD, optional: true }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
