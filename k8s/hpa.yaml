# 자동 확장: 서버 Pod 2~5개, 평균 CPU 사용률(요청 250m 대비) 50% 목표
#
# CPU 지표에는 metrics-server 가 필요 (Docker Desktop 에는 기본으로 없음). 한 번만 설치:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
#   Docker Desktop 의 kubelet 인증서는 자체 서명이라 --kubelet-insecure-tls 를 추가해야 지표가 수집됨:
#   kubectl -n kube-system patch deployment metrics-server --type=json \
#     -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#   확인: kubectl top pods -n chichijik   (1분쯤 뒤 값이 나오면 kubectl get hpa 의 TARGETS 도 <unknown> 이 아님)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chichijik
  namespace: chichijik
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chichijik
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # 부하가 사라지면 60초 동안 지켜본 뒤 줄임 (기본 300초 → 1~2분 안에 최소 개수로)
    scaleDown:
      stabilizationWindowSeconds: 60
