# 업로드 영상: 모든 서버 Pod 가 함께 마운트하는 공유 볼륨 (cluster 프로필의 UPLOAD_DIR=/data/uploads)
# Docker Desktop 은 노드가 하나라서 ReadWriteOnce 볼륨을 같은 노드의 여러 Pod 가 함께 마운트할 수 있음.
# (노드가 여러 대인 클러스터라면 ReadWriteMany 를 지원하는 StorageClass 가 필요)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chichijik-uploads
  namespace: chichijik
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
