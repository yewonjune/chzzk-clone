# A1(ARM) 재고가 없어 VM.Standard.E2.1.Micro(AMD, 1GB 메모리)를 쓸 때 덧씌우는 설정
#   PostgreSQL·Redis 를 띄우지 않고 앱 기본 프로필(H2 파일 DB, 메모리 세션)로 실행해 메모리를 아낍니다.
#   docker compose -f deploy/oci/compose.yaml -f deploy/oci/compose.micro.yaml --env-file deploy/oci/.env up -d --build
# 이미지 빌드(Gradle)에 메모리가 부족하면 VM 에 스왑을 먼저 만드세요 (README "Micro 대안" 참고).
# .env 의 DB_PASSWORD 는 compose.yaml 형식 때문에 값이 있어야 하지만 이 구성에서는 쓰이지 않습니다.
services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: default
      DATA_DIR: /app/data
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:+ExitOnOutOfMemoryError"
    depends_on: !reset {}
    volumes:
      - uploads:/data/uploads
      - h2data:/app/data
  postgres:
    profiles: ["disabled"]
  redis:
    profiles: ["disabled"]

volumes:
  h2data:
